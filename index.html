
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Документ1 — Редактор</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
</head>
<body>

<!-- Шапка (как на скрине) -->
<div class="top-header">
  <div class="header-left">
    <div class="menu-btn"><i class="fas fa-bars"></i> Меню</div>
    <div class="autosave">
      <span>Автосохранение файла</span>
      <label class="switch"><input type="checkbox"><span class="slider"></span></label>
    </div>
    <div class="quick-btns">
      <i class="far fa-save" title="Сохранить" data-act="save-html"></i>
      <i class="fas fa-folder-open" title="Открыть" data-act="open"></i>
      <i class="fas fa-undo" title="Отменить" data-cmd="undo"></i>
      <i class="fas fa-redo" title="Повторить" data-cmd="redo"></i>
    </div>
  </div>
  <div class="header-right">
    <span class="cloud-status"><i class="fas fa-cloud"></i> Не в облаке</span>
    <div class="user-avatar">М</div>
  </div>
</div>

<!-- Вкладки -->
<div class="tab-bar">
  <div class="tab active" data-tab="home">Главная</div>
  <div class="tab" data-tab="insert">Вставка</div>
  <div class="tab" data-tab="layout">Разметка страницы</div>
  <div class="tab" data-tab="references">Ссылки</div>
  <div class="tab" data-tab="review">Рецензирование</div>
  <div class="tab" data-tab="view">Вид</div>
  <div class="tab" data-tab="tools">Инструменты</div>
</div>

<!-- Панель инструментов (как на скрине) -->
<div class="toolbar" id="tb-home">
  
  <!-- Группа: Буфер обмена -->
  <div class="group">
    <div class="group-content">
      <div class="btn-col" data-act="format-painter">
        <i class="fas fa-paint-brush"></i>
        <span>Формат<br>по образцу</span>
      </div>
      <div class="btn-col" data-cmd="paste">
        <i class="fas fa-paste"></i>
        <span>Вставить</span>
      </div>
      <div class="btn-col small">
        <i class="fas fa-cut" data-cmd="cut" title="Вырезать"></i>
        <i class="fas fa-copy" data-cmd="copy" title="Копировать"></i>
      </div>
    </div>
    <div class="group-title">Буфер обмена</div>
  </div>

  <!-- Группа: Шрифт -->
  <div class="group">
    <div class="group-content column">
      <div class="row">
        <select id="font-family" class="sel-font">
          <option>Calibri (Основной)</option>
          <option>Times New Roman</option>
          <option>Arial</option>
          <option>Georgia</option>
        </select>
        <select id="font-size">
          <option>8</option><option>9</option><option>10</option><option selected>11</option>
          <option>12</option><option>14</option><option>16</option><option>18</option><option>24</option>
        </select>
        <i class="fas fa-search-plus" data-act="grow-font" title="Увеличить шрифт"></i>
        <i class="fas fa-search-minus" data-act="shrink-font" title="Уменьшить шрифт"></i>
        <i class="fas fa-font" data-act="change-case" title="Регистр"></i>
        <i class="fas fa-eraser" data-act="clear-format" title="Очистить формат"></i>
      </div>
      <div class="row">
        <button data-cmd="bold" class="txt-btn"><b>Ж</b></button>
        <button data-cmd="italic" class="txt-btn"><i>К</i></button>
        <button data-cmd="underline" class="txt-btn"><u>Ч</u></button>
        <button data-cmd="strikeThrough" class="txt-btn"><s>З</s></button>
        <button data-cmd="subscript" class="txt-btn">X<sub>2</sub></button>
        <button data-cmd="superscript" class="txt-btn">X<sup>2</sup></button>
        <i class="fas fa-highlighter" data-act="highlight" title="Выделить"></i>
        <input type="color" id="text-color" value="#000000" title="Цвет текста">
      </div>
    </div>
    <div class="group-title">Шрифт</div>
  </div>

  <!-- Группа: Абзац -->
  <div class="group">
    <div class="group-content column">
      <div class="row">
        <i class="fas fa-list-ul" data-cmd="insertUnorderedList" title="Маркированный список"></i>
        <i class="fas fa-list-ol" data-cmd="insertOrderedList" title="Нумерованный список"></i>
        <i class="fas fa-tasks" data-act="checklist" title="Чек-лист"></i>
        <i class="fas fa-outdent" data-cmd="outdent" title="Уменьшить отступ"></i>
        <i class="fas fa-indent" data-cmd="indent" title="Увеличить отступ"></i>
      </div>
      <div class="row">
        <i class="fas fa-align-left" data-cmd="justifyLeft"></i>
        <i class="fas fa-align-center" data-cmd="justifyCenter"></i>
        <i class="fas fa-align-right" data-cmd="justifyRight"></i>
        <i class="fas fa-align-justify" data-cmd="justifyFull"></i>
        <i class="fas fa-arrows-alt-v" data-act="line-spacing" title="Интервал"></i>
        <i class="fas fa-border-all" data-act="borders" title="Границы"></i>
      </div>
    </div>
    <div class="group-title">Абзац</div>
  </div>

  <!-- Группа: Стили -->
  <div class="group">
    <div class="group-content">
      <div class="style-box active" data-act="style-normal">
        <span>Обычный</span>
      </div>
      <div class="style-box bold" data-act="style-heading">
        <span>Заголовок 1</span>
      </div>
      <i class="fas fa-chevron-down" style="align-self: center; padding: 0 5px;"></i>
    </div>
    <div class="group-title">Стили</div>
  </div>

  <!-- Группа: Редактирование -->
  <div class="group">
    <div class="group-content column">
      <div class="row">
        <i class="fas fa-search" data-act="find"></i>
        <span>Поиск и<br>замена</span>
      </div>
      <div class="row">
        <i class="fas fa-spell-check" data-act="spell"></i>
        <span>Проверка<br>орфографии</span>
      </div>
    </div>
    <div class="group-title">Редактирование</div>
  </div>

  <!-- Группа: Выделение -->
  <div class="group">
    <div class="group-content column">
      <div class="row"><i class="fas fa-mouse-pointer" data-act="select-all"></i><span>Выделить</span></div>
    </div>
    <div class="group-title">Выделение</div>
  </div>

</div>

<!-- Рабочая область (лист) -->
<div class="workspace">
  <div class="page" id="page">
    <div id="editor" contenteditable="true"></div>
  </div>
</div>

<!-- Статус-бар -->
<div class="statusbar">
  <span id="stat-words">Слов: 0</span>
  <span id="stat-chars">Символов: 0</span>
  <span id="stat-pages">Страниц: 1</span>
  <span id="stat-lang">Русский</span>
</div>

<input type="file" id="file-input" style="display:none">
<script src="script.js"></script>
</body>
</html>
